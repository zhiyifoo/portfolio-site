<form class="contact-form" id="contact-form">
  <div class="field-name"><input type="text" name="name" placeholder="Name" required></div>
  <div class="field-email"><input type="email" name="email" placeholder="Email" required></div>
  <div class="field-message"><textarea name="message" placeholder="Message" required></textarea></div>
  <div class="field-submit"><button type="submit">Send</button></div>
</form>
<script>
document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target;
  var subject = encodeURIComponent('Portfolio contact from ' + f.name.value);
  var body = encodeURIComponent(f.message.value + '\n\n— ' + f.name.value + ' (' + f.email.value + ')');
  window.location.href = 'mailto:foozhiyi@gmail.com?subject=' + subject + '&body=' + body;
});
</script>
